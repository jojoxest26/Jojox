<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Il sito ha già una traduzione vera (IT/EN) — Google Translate che riscrive
         il DOM da fuori va in conflitto con React e può bloccare la pagina a metà
         caricamento, quindi chiediamo al browser di non proporla. -->
    <meta name="google" content="notranslate" />
    <meta
      name="description"
      content="JoJoX controlla il tuo codice — scritto a mano o generato dall'AI — con 64 controlli di sicurezza pubblici, un punteggio 0-100 e correzioni pronte da copiare."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>JoJoX — Sicurezza per il tuo codice</title>
    <script>
      // Imposta il tema PRIMA che React monti, leggendo la stessa chiave che
      // usa ThemeContext — altrimenti la pagina lampeggerebbe un istante nel
      // tema sbagliato (scuro di default) prima di passare a quello salvato.
      (function () {
        try {
          var saved = localStorage.getItem("jojox_theme");
          if (saved === "light" || saved === "dark") {
            document.documentElement.setAttribute("data-theme", saved);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
